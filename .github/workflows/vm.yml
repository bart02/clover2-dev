name: Build VM

on:
  push:
    branches: [master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include: 
          - runs-on: self-hosted
            arch: amd64
          # - runs-on: ubuntu-24.04-arm
          #   arch: arm64
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v7

      - name: Copy userpatches for builder
        run: |
          mv ansible/ userpatches/overlay/ansible/
          mkdir -p custom/userpatches
          cp -r userpatches/* custom/userpatches/

      - uses: ./.github/actions/vm-build
        id: vm_build
        with:
          armbian_token: ${{ secrets.GITHUB_TOKEN }}
          armbian_target: "clover2-vm-${{ matrix.arch }}"
          # armbian_runner_clean: "yes" # recommended for Github runners

      - name: Upload img to S3
        run: |
          aws s3 sync "${{ steps.vm_build.outputs.armbian_artifacts }}" \
            "s3://clover-vm/${{ github.run_id }}/" \
            --acl public-read --no-progress
          for artifact in "${{ steps.vm_build.outputs.armbian_artifacts }}"/*; do
            [[ -f "$artifact" ]] || continue
            echo "Uploaded https://clover-vm.s3.cloud.ru/${{ github.run_id }}/$(basename "$artifact")"
          done
        env:
          AWS_ACCESS_KEY_ID: ${{secrets.AWS_ACCESS_KEY_ID}}
          AWS_SECRET_ACCESS_KEY: ${{secrets.AWS_SECRET_ACCESS_KEY}}
          AWS_ENDPOINT_URL: https://s3.cloud.ru/
          AWS_DEFAULT_REGION: ru-central-1
